name: bremer

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: evs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evs -d evs"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  migrate:
    build:
      context: .
      target: tools
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://evs:${POSTGRES_PASSWORD}@postgres:5432/evs?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://evs:${POSTGRES_PASSWORD}@postgres:5432/evs?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
      PORT: "3000"
      AUTH_TRUST_HOST: "true"
      TRUSTED_PROXY: cloudflare
      MAX_ZIP_BYTES: "94371840"
    volumes:
      - storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [internal]

  worker:
    build:
      context: .
      target: tools
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://evs:${POSTGRES_PASSWORD}@postgres:5432/evs?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]

  scheduler:
    build:
      context: .
      target: tools
    command: ["sh", "-c", "while true; do npm run retention; sleep 86400; done"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://evs:${POSTGRES_PASSWORD}@postgres:5432/evs?schema=public
      STORAGE_DIR: /app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  seed:
    profiles: ["seed"]
    build:
      context: .
      target: tools
    command: ["npm", "run", "db:seed"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://evs:${POSTGRES_PASSWORD}@postgres:5432/evs?schema=public
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  storage:

networks:
  internal:
    driver: bridge
