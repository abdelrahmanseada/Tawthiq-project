name: employee-verification

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evs-local-password}
      POSTGRES_DB: evs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evs -d evs"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  migrate:
    build:
      context: .
      target: tools
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://evs:${POSTGRES_PASSWORD:-evs-local-password}@postgres:5432/evs?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://evs:${POSTGRES_PASSWORD:-evs-local-password}@postgres:5432/evs?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_URL: ${APP_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  worker:
    build:
      context: .
      target: tools
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://evs:${POSTGRES_PASSWORD:-evs-local-password}@postgres:5432/evs?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - internal

  scheduler:
    build:
      context: .
      target: tools
    # Daily retention job (scan log auto-purge). Runs immediately, then every 24h.
    command:
      - sh
      - -c
      - "while true; do npm run retention; sleep 86400; done"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://evs:${POSTGRES_PASSWORD:-evs-local-password}@postgres:5432/evs?schema=public
      STORAGE_DIR: /app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  # Run once with: docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: .
      target: tools
    command: ["npm", "run", "db:seed"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://evs:${POSTGRES_PASSWORD:-evs-local-password}@postgres:5432/evs?schema=public
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  storage:

networks:
  internal:
